name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out Control Plane
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      # Development dependencies intentionally link to the qualified Harness
      # source tree, so CI recreates that sibling layout on a fresh runner.
      - name: Check out qualified Harness
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.2-alpha.1
          path: deepseek-harness-latest
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: |
            plugin/pnpm-lock.yaml
            deepseek-harness-latest/pnpm-lock.yaml

      - name: Install Harness dependencies
        run: pnpm install --frozen-lockfile
        working-directory: deepseek-harness-latest

      - name: Build Harness libraries
        run: pnpm build:lib
        working-directory: deepseek-harness-latest

      - name: Install Control Plane dependencies
        run: pnpm install --frozen-lockfile
        working-directory: plugin

      - name: Lint
        run: pnpm lint
        working-directory: plugin

      - name: Typecheck
        run: pnpm typecheck
        working-directory: plugin

      - name: Test
        run: pnpm test
        working-directory: plugin

      - name: Build
        run: pnpm build
        working-directory: plugin

      - name: Inspect packed artifact
        run: pnpm pack:dry-run
        working-directory: plugin
